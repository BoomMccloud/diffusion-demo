<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradDiff" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gradQwen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Header -->
  <text x="40" y="45" fill="#f8fafc" font-size="24" font-weight="bold">Speed &amp; Latency Benchmark: DiffuSpace vs. Qwen 3.6 Flash</text>
  <text x="40" y="72" fill="#94a3b8" font-size="14">Throughput (TPS), Per-Step Latencies, and Time-to-Completion across 130 MiniWoB++ Tasks</text>

  <!-- Legend -->
  <g transform="translate(600, 28)">
    <rect x="0" y="0" width="320" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="16" y="11" width="16" height="13" rx="3" fill="url(#gradDiff)"/>
    <text x="38" y="22" fill="#f1f5f9" font-size="12" font-weight="600">DiffuSpace (~207 TPS)</text>
    <rect x="16" y="29" width="16" height="13" rx="3" fill="url(#gradQwen)"/>
    <text x="38" y="40" fill="#f1f5f9" font-size="12" font-weight="600">Qwen 3.6 Flash (~99 TPS)</text>
  </g>

  <!-- KPI Cards -->
  <g transform="translate(40, 105)">
    <!-- Card 1: Throughput -->
    <rect x="0" y="0" width="270" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="28" fill="#94a3b8" font-size="13">Generation Throughput (TPS)</text>
    <text x="18" y="60" fill="#818cf8" font-size="28" font-weight="bold">207.4 <tspan font-size="16" fill="#94a3b8">tok/s</tspan></text>
    <text x="18" y="82" fill="#34d399" font-size="12" font-weight="600">2.1x faster vs. Qwen (98.7 tok/s)</text>

    <!-- Card 2: Mean Step Latency -->
    <rect x="290" y="0" width="270" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="308" y="28" fill="#94a3b8" font-size="13">Mean Step Latency</text>
    <text x="308" y="60" fill="#818cf8" font-size="28" font-weight="bold">2.03 <tspan font-size="16" fill="#94a3b8">seconds</tspan></text>
    <text x="308" y="82" fill="#34d399" font-size="12" font-weight="600">2.43x faster vs. Qwen (4.93s)</text>

    <!-- Card 3: Time-to-Completion -->
    <rect x="580" y="0" width="290" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="598" y="28" fill="#94a3b8" font-size="13">Mean Task Time-to-Completion</text>
    <text x="598" y="60" fill="#818cf8" font-size="28" font-weight="bold">4.97 <tspan font-size="16" fill="#94a3b8">seconds</tspan></text>
    <text x="598" y="82" fill="#34d399" font-size="12" font-weight="600">1.94x faster vs. Qwen (9.65s)</text>
  </g>

  <!-- Detailed Latency Bars -->
  <g transform="translate(40, 230)">
    <text x="0" y="0" fill="#f8fafc" font-size="16" font-weight="bold">Latency Distribution Breakdown (Seconds per Action Step)</text>

    <!-- Row: p50 (Median) -->
    <text x="160" y="38" fill="#f1f5f9" font-size="13" text-anchor="end">Median (p50)</text>
    <rect x="180" y="24" width="74" height="14" rx="3" fill="url(#gradDiff)"/>
    <text x="260" y="36" fill="#c7d2fe" font-size="11" font-weight="600">1.23s</text>
    <rect x="180" y="42" width="109" height="14" rx="3" fill="url(#gradQwen)"/>
    <text x="295" y="54" fill="#bae6fd" font-size="11" font-weight="600">1.82s (1.48x slower)</text>

    <!-- Row: Mean -->
    <text x="160" y="98" fill="#f1f5f9" font-size="13" text-anchor="end">Mean</text>
    <rect x="180" y="84" width="122" height="14" rx="3" fill="url(#gradDiff)"/>
    <text x="308" y="96" fill="#c7d2fe" font-size="11" font-weight="600">2.03s</text>
    <rect x="180" y="102" width="296" height="14" rx="3" fill="url(#gradQwen)"/>
    <text x="482" y="114" fill="#bae6fd" font-size="11" font-weight="600">4.93s (2.43x slower)</text>

    <!-- Row: p90 -->
    <text x="160" y="158" fill="#f1f5f9" font-size="13" text-anchor="end">p90 Latency</text>
    <rect x="180" y="144" width="301" height="14" rx="3" fill="url(#gradDiff)"/>
    <text x="487" y="156" fill="#c7d2fe" font-size="11" font-weight="600">5.02s</text>
    <rect x="180" y="162" width="550" height="14" rx="3" fill="url(#gradQwen)"/>
    <text x="736" y="174" fill="#bae6fd" font-size="11" font-weight="600">15.06s (3.00x slower)</text>

    <!-- Row: Max Tail -->
    <text x="160" y="218" fill="#f1f5f9" font-size="13" text-anchor="end">Max Tail Latency</text>
    <rect x="180" y="204" width="394" height="14" rx="3" fill="url(#gradDiff)"/>
    <text x="580" y="216" fill="#c7d2fe" font-size="11" font-weight="600">6.57s (Stable)</text>
    <rect x="180" y="222" width="670" height="14" rx="3" fill="#ef4444"/>
    <text x="856" y="234" fill="#fca5a5" font-size="11" font-weight="600">26.75s (Timeout Trap)</text>
  </g>
</svg>
